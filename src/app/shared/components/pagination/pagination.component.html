<div class="pagination">
  @if (page() > 1) {
    <button 
      class="arrow-left"
      (click)="pageChange.emit(page() - 1)"
    >
      <svg width="10" height="10">
        <use xlink:href="assets/svg/sprite.svg#chevron-left"></use>
      </svg>
    </button>
  }
  @for (p of pages(); track $index) {
    @if (p === '...') {
      <span>...</span>
    } @else {
      <button 
        class="page"
        [class.active]="p === page()"
        (click)="pageChange.emit(+p)"
      >
        {{ p }}
      </button>
    }
  }
  @if (page() < total()) {
    <button 
      class="arrow-right"
      (click)="pageChange.emit(page() + 1)"
    >
      <svg width="10" height="10">
        <use xlink:href="assets/svg/sprite.svg#chevron-right"></use>
      </svg>
    </button>
  }
</div>
